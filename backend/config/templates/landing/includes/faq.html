<section class="section" id="faq" aria-labelledby="faq-title">
  <div class="wrap">
    <div class="section-head">
      <p class="section-kicker">Ayuda</p>
      <h2 class="section-title" id="faq-title">Preguntas frecuentes</h2>
      <p class="section-lead">Respuestas cortas para pedir comida o registrar tu negocio.</p>
    </div>

    <div class="faq-list">
      {% for item in landing_faqs %}
        <details>
          <summary>{{ item.question }}</summary>
          <p class="faq-a">{{ item.answer }}</p>
        </details>
      {% endfor %}
    </div>
  </div>
</section>
